<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>黒川温泉観光協会｜コントロールパネル(管理)</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';"
    />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,shrink-to-fit=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/images/favicon/favicon.svg"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/images/favicon/apple-touch-icon.png"
    />
    <link rel="shortcut icon" href="../assets/images/favicon/favicon.ico" />
    <link rel="stylesheet" href="../assets/css/client04-03.css" />
  </head>

  <body>
    <!--#include virtual="./inc_header.html"-->
    <main class="inner-04-03-01 status-client">
      <section class="container-left-menu menu-color04">
        <div class="title">飲食店予約</div>
        <nav>
          <a href="#"><span>席管理</span></a>
          <a href="#"><span>予約基本設定</span></a>
          <a href="#" class="is-active"><span>食事メニュー管理</span></a>
          <a href="#"><span>予約カレンダー</span></a>
          <a href="#"><span>予約一覧</span></a>
          <a href="#"><span>予約詳細</span></a>
        </nav>
      </section>
      <div class="main-contents menu-color04">
        <div class="block_inner">
          <h2>予約基本設定</h2>

          <form>
            <h3>メニュー情報</h3>
            <dl>
              <div class="box-name">
                <dt>メニュー名</dt>
                <dd>
                  <input type="text" />
                </dd>
              </div>
              <div class="box-price">
                <dt>料金</dt>
                <dd><input type="text" />円</dd>
              </div>
              <div class="box-image">
                <dt class="position-top">画像</dt>
                <dd>
                  <div class="select-image">
                    <h4>画像をここにドラッグ＆ドロップ</h4>
                    <span>または</span>
                    <button>＋ファイルを選択</button>
                    <span>JPG / PNG / WebP｜最大5MB｜最大8枚</span>
                    <!-- NOTE 警告用表示 -->
                    <!-- <div class="wrap-caution">
                    <h5>ファイルサイズが大きすぎます</h5>
                    <p>画像の容量を圧縮してしてから再度アップロードしてください。</p>
                  </div> -->
                  </div>
                  <ul>
                    <li data-name="001.jpg">
                      <button type="button"></button>
                      <picture>
                        <source srcset="../assets/images/_dummy/item203.webp" />
                        <img
                          src="../assets/images/_dummy/item203.webp"
                          alt="商品画像"
                        />
                      </picture>
                    </li>
                  </ul>
                </dd>
              </div>
              <div>
                <dt class="position-top">説明文</dt>
                <dd>
                  <textarea></textarea>
                </dd>
              </div>
              <div class="box-periode">
                <dt class="position-top">掲載期間</dt>
                <dd>
                  <div class="wrap-dd-top">
                    <input
                      type="radio"
                      name="mealMenuFlg"
                      id="mealMenuFlg_02"
                      value="1"
                    /><label for="mealMenuFlg_02">無期限</label>
                  </div>
                  <div class="wrap-dd-bottom">
                    <div class="item-check-box">
                      <input
                        type="radio"
                        name="mealMenuFlg"
                        id="mealMenuFlg_03"
                        value="2"
                      /><label for="mealMenuFlg_03">期間を指定する</label>
                    </div>
                    <div class="item-periode">
                      <span>開始日</span>
                      <input type="date" name="searchStartDay" />
                      <i>〜</i>
                      <span>終了日</span>
                      <input type="date" name="searchEndDay" />
                    </div>
                  </div>
                </dd>
              </div>
              <div class="box-status">
                <dt>状態</dt>
                <dd>
                  <div class="item-toggle">
                    <div
                      class="wrap-toggle-button"
                      data-tooltip-on="有効中 | 無効にする"
                      data-tooltip-off="無効中 | 有効する"
                    >
                      <label class="toggle-button">
                        <input type="checkbox" checked />
                      </label>
                    </div>
                  </div>
                </dd>
              </div>
            </dl>
            <div class="box-btn">
              <button class="btn-cancel">キャンセル</button>
              <button class="btn-confirmed">保存</button>
            </div>
          </form>

          <a href="#body" class="move_page-top"><i>↑</i>TOPへ</a>
        </div>
      </div>
    </main>
    <script src="../assets/js/common.js" defer></script>
  </body>
</html>
